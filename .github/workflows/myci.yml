name: MYCI
 
on:

  push:

  pull_request:
 
permissions:

  contents: read

  pull-requests: write
 
 
jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code 

        uses: actions/checkout@v4
 
      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"
 
      - name: Install dependencies

        run: pip install -r requirements.txt
 
      - name: Build

        run: python -m compileall
 
  test:

    needs: build

    runs-on: ubuntu-latest

    steps:

        - name: Checkout code 

          uses: actions/checkout@v4
 
        - name: Setup Python

          uses: actions/setup-python@v5

          with:

            python-version: "3.12"
 
        - name: Install dependencies

          run: pip install -r requirements.txt
 
        - name: Run tests

          run: pytest

  docker:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      - name: Build Docker image

        run: docker build -t devops-demo:${{ github.sha }} .

      - name: Run application inside container

        run: docker run devops-demo:${{ github.sha }}
 
